; OTBench — HIL tester firmware for the OpenTurbine bench rig.
; Runs on a classic ESP32 wired pin-to-pin to an ESP32-S3 running OpenTurbine.
; It is a dumb I/O slave: the PC harness drives it over USB serial (115200).
;
; Same Arduino-ESP32 3.x (IDF5) core as OpenTurbine, so the v3 LEDC API
; (ledcAttach / ledcWrite(pin,duty) / ledcWriteTone) is available.
;
; Build & flash from this folder:  pio run -t upload
; Then leave it plugged in — the harness talks to it on its COM port.

[env:otbench]
platform     = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework    = arduino
board        = esp32dev
build_flags  =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
monitor_speed = 115200
upload_port  = COM3
monitor_port = COM3
; Match the ECU uploader: the current Classic board supports USB auto-reset.
; Boards without working auto-reset still need BOOT held while EN is tapped.
upload_flags =
    --before=default_reset
    --after=hard_reset

; ── Role-reversed: OTBench on the ESP32-S3, driving/reading a classic ESP32 that runs
;    OpenTurbine (the DUT). Same jumpers, S3 side of each wire; no DAC on the S3 so the two
;    analog sensor inputs are dropped. Flash to the S3's port (COM4). ──
[env:otbench_s3]
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework     = arduino
board         = esp32-s3-devkitc-1
build_flags   =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DOTBENCH_S3
monitor_speed = 115200
upload_port   = COM4
monitor_port  = COM4
