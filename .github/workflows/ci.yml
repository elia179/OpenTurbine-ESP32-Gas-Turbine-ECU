name: Required safety gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-behavior:
    name: Native control and MAVLink behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install platformio==6.1.19 pymavlink==2.4.50
      - run: python tools/run_native_behavior_tests.py
      - run: python tools/test_mavlink_interop.py
      - run: python -m unittest tools/test_mavlink_console.py

  setup-tool-windows-tests:
    name: Windows setup-tool behavior
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/setup_tool
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: tools/setup_tool/go.mod
          cache-dependency-path: tools/setup_tool/go.mod
      - run: go test ./...

  required-safety-gate:
    name: Required safety gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/setup_tool/go.mod
          cache-dependency-path: tools/setup_tool/go.mod
      - run: python -m pip install platformio==6.1.19 pymavlink==2.4.50
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run canonical OpenTurbine release checks
        run: python tools/run_release_checks.py
      - name: Require generated assets to be committed
        run: git diff --exit-code -- data site/_includes/generated-config-fields.html
