name: Build and deploy public site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - README.md
      - data_src/config.html
      - data_src/pages/config-schema.js
      - tools/generate_documentation_index.py
      - tools/generate_site_config_reference.cjs
      - tools/validate_public_content.py
      - tools/audit_guided_builds.cjs
      - tools/generate_guided_build_diagrams.py
      - tools/capture_guided_build_screenshots.cjs
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - README.md
      - data_src/config.html
      - data_src/pages/config-schema.js
      - tools/generate_documentation_index.py
      - tools/generate_site_config_reference.cjs
      - tools/validate_public_content.py
      - tools/audit_guided_builds.cjs
      - tools/generate_guided_build_diagrams.py
      - tools/capture_guided_build_screenshots.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      - name: Generate Config field reference
        run: |
          node tools/generate_site_config_reference.cjs
          python3 tools/generate_documentation_index.py
          git diff --exit-code -- site/_includes/generated-config-fields.html site/_data/config_search.json site/_data/documentation.json
      - name: Validate public content
        run: python3 tools/validate_public_content.py
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
          future: true
      - name: Validate generated metadata, sitemap, links, anchors, images, and JSON-LD
        run: python3 tools/validate_public_content.py --built _site
      - name: Install browser audit dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check public documentation in the browser
        env:
          OT_AUDIT_SHOTS: ${{ runner.temp }}/documentation-review
        run: node tools/audit_guided_builds.cjs
      - name: Upload documentation review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-review
          path: ${{ runner.temp }}/documentation-review
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: ./_site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
