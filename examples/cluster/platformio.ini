[platformio]
src_dir = MavlinkClusterExample

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
lib_extra_dirs = ../../libraries
monitor_speed = 115200

[env:esp32s3dev]
extends = env:esp32dev
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB

; No-load OTBench wiring only: Classic GPIO22 -> S3 GPIO12,
; S3 GPIO2 -> Classic GPIO27. Other ECU uses of these pins must be disabled.
[env:otbench_s3_receiver]
extends = env:esp32s3dev
build_flags = -DOT_CLUSTER_RX_PIN=12 -DOT_CLUSTER_TX_PIN=2 -DOT_CLUSTER_OBSERVE_PIN=11

[env:otbench_classic_receiver]
extends = env:esp32dev
build_flags = -DOT_CLUSTER_RX_PIN=22 -DOT_CLUSTER_TX_PIN=27 -DOT_CLUSTER_OBSERVE_PIN=21
