<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Dry-contact input with internal pull-up</title><desc id="desc">Enable Pull-up and active-low in Hardware. Closed contact connects GPIO to GND.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eef4f8;font-size:19px}.small{font-size:16px;fill:#bac9d6}.heading{font-size:26px;font-weight:bold}.net{fill:none;stroke-width:3;stroke-linejoin:round}.heavy{stroke-width:5}</style>
<rect width="1000" height="600" rx="18" fill="#101922"/>
<text x="30" y="42" class="heading" text-anchor="start">Dry-contact input with internal pull-up</text>
<text x="30" y="76" class="small" text-anchor="start">Enable Pull-up and active-low in Hardware. Closed contact connects GPIO to GND.</text>
<rect x="35" y="115" width="280" height="350" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="175.0" y="147" class="" text-anchor="middle">ESP32 ECU</text>
<rect x="685" y="115" width="280" height="350" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="825.0" y="147" class="" text-anchor="middle">Dry contact</text>
<text x="130" y="190" class="" text-anchor="middle">3.3 V</text>
<polyline points="130,200 130,225" class="net" stroke="#ff9276"/>
<rect x="121" y="225" width="18" height="42" fill="#101922" stroke="#b6c4d2" stroke-width="2"/>
<text x="148" y="253" class="small" text-anchor="start">Internal</text>
<polyline points="130,267 130,305 315,305" class="net" stroke="#74dcb7"/>
<text x="55" y="355" class="small" text-anchor="start">Pull-up enabled</text>
<text x="295" y="294" class="" text-anchor="end">GPIO</text>
<text x="705" y="294" class="" text-anchor="start">Contact A</text>
<polyline points="315,305 685,305" class="net" stroke="#74dcb7"/>
<circle cx="130" cy="305" r="5" fill="#74dcb7"/>
<text x="295" y="389" class="" text-anchor="end">GND</text>
<text x="705" y="389" class="" text-anchor="start">Contact B</text>
<polyline points="315,400 685,400" class="net" stroke="#b6c4d2"/>
<text x="350" y="480" class="small" text-anchor="start">Pins without internal bias need an external pull-up.</text>
<text x="30" y="558" class="small" text-anchor="start">Signal / command</text>
<polyline points="190,552 242,552" class="net" stroke="#74dcb7"/>
<text x="270" y="558" class="small" text-anchor="start">Supply / load power</text>
<polyline points="447,552 499,552" class="net" stroke="#ff9276"/>
<text x="528" y="558" class="small" text-anchor="start">Ground / return</text>
<polyline points="695,552 747,552" class="net" stroke="#b6c4d2"/>
<text x="30" y="584" class="small" text-anchor="start">Connections are also listed in the guide. Confirm the exact module pinout before wiring.</text></svg>
