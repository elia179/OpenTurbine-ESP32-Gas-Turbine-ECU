<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Potentiometer throttle input</title><desc id="desc">Bench example: 10 kΩ linear potentiometer between 3.3 V and GND.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eef4f8;font-size:19px}.small{font-size:16px;fill:#bac9d6}.heading{font-size:26px;font-weight:bold}.net{fill:none;stroke-width:3;stroke-linejoin:round}.heavy{stroke-width:5}</style>
<rect width="1000" height="600" rx="18" fill="#101922"/>
<text x="30" y="42" class="heading" text-anchor="start">Potentiometer throttle input</text>
<text x="30" y="76" class="small" text-anchor="start">Bench example: 10 kΩ linear potentiometer between 3.3 V and GND.</text>
<rect x="35" y="120" width="280" height="330" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="175.0" y="152" class="" text-anchor="middle">ESP32 ECU</text>
<text x="295" y="180" class="" text-anchor="end">3.3 V</text>
<polyline points="315,190 660,190 660,248" class="net" stroke="#ff9276"/>
<rect x="645" y="248" width="30" height="100" fill="#1c2b38" stroke="#b6c4d2" stroke-width="2"/>
<text x="705" y="275" class="" text-anchor="start">10 kΩ linear</text>
<text x="705" y="305" class="" text-anchor="start">potentiometer</text>
<text x="295" y="288" class="" text-anchor="end">ADC GPIO</text>
<polyline points="315,298 645,298" class="net" stroke="#74dcb7"/>
<text x="420" y="280" class="small" text-anchor="start">Wiper</text>
<path d="M 632,290 L 645,298 L 632,306" fill="none" stroke="#74dcb7" stroke-width="2"/>
<text x="295" y="392" class="" text-anchor="end">GND</text>
<polyline points="315,402 660,402 660,348" class="net" stroke="#b6c4d2"/>
<text x="335" y="480" class="small" text-anchor="start">Identify the wiper with a meter; do not rely on the physical pin order.</text>
<text x="30" y="558" class="small" text-anchor="start">Signal / command</text>
<polyline points="190,552 242,552" class="net" stroke="#74dcb7"/>
<text x="270" y="558" class="small" text-anchor="start">Supply / load power</text>
<polyline points="447,552 499,552" class="net" stroke="#ff9276"/>
<text x="528" y="558" class="small" text-anchor="start">Ground / return</text>
<polyline points="695,552 747,552" class="net" stroke="#b6c4d2"/>
<text x="30" y="584" class="small" text-anchor="start">Connections are also listed in the guide. Confirm the exact module pinout before wiring.</text></svg>
