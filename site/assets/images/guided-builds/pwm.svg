<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">PWM driver and load</title><desc id="desc">Nonisolated low-side driver module: logic input must accept 3.3 V.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eef4f8;font-size:19px}.small{font-size:16px;fill:#bac9d6}.heading{font-size:26px;font-weight:bold}.net{fill:none;stroke-width:3;stroke-linejoin:round}.heavy{stroke-width:5}</style>
<rect width="1000" height="600" rx="18" fill="#101922"/>
<text x="30" y="42" class="heading" text-anchor="start">PWM driver and load</text>
<text x="30" y="76" class="small" text-anchor="start">Nonisolated low-side driver module: logic input must accept 3.3 V.</text>
<rect x="30" y="190" width="245" height="265" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="152.5" y="222" class="" text-anchor="middle">ESP32 ECU</text>
<rect x="455" y="190" width="260" height="265" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="585.0" y="222" class="" text-anchor="middle">Rated power driver</text>
<rect x="790" y="190" width="180" height="265" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="880.0" y="222" class="" text-anchor="middle">DC load</text>
<text x="255" y="275" class="" text-anchor="end">PWM GPIO</text>
<text x="475" y="275" class="" text-anchor="start">IN</text>
<polyline points="275,285 455,285" class="net" stroke="#74dcb7"/>
<text x="255" y="385" class="" text-anchor="end">GND</text>
<text x="475" y="385" class="" text-anchor="start">GND</text>
<polyline points="275,395 455,395" class="net" stroke="#b6c4d2"/>
<text x="30" y="120" class="" text-anchor="start">Load supply + → fuse → independent stop → load +</text>
<polyline points="800,130 910,130 910,190" class="net heavy" stroke="#ff9276"/>
<text x="735" y="325" class="small" text-anchor="start">LOAD −</text>
<polyline points="715,345 790,345" class="net heavy" stroke="#ff9276"/>
<text x="475" y="430" class="small" text-anchor="start">Power GND</text>
<polyline points="585,455 585,492 350,492" class="net heavy" stroke="#b6c4d2"/>
<polyline points="350,492 350,395" class="net" stroke="#b6c4d2"/>
<circle cx="350" cy="395" r="5" fill="#b6c4d2"/>
<text x="30" y="511" class="small" text-anchor="start">Supply − joins at the return point; load current does not pass through the ECU.</text>
<text x="745" y="425" class="small" text-anchor="start">Use driver-specified</text>
<text x="745" y="450" class="small" text-anchor="start">load suppression.</text>
<text x="30" y="558" class="small" text-anchor="start">Signal / command</text>
<polyline points="190,552 242,552" class="net" stroke="#74dcb7"/>
<text x="270" y="558" class="small" text-anchor="start">Supply / load power</text>
<polyline points="447,552 499,552" class="net" stroke="#ff9276"/>
<text x="528" y="558" class="small" text-anchor="start">Ground / return</text>
<polyline points="695,552 747,552" class="net" stroke="#b6c4d2"/>
<text x="30" y="584" class="small" text-anchor="start">Connections are also listed in the guide. Confirm the exact module pinout before wiring.</text></svg>
