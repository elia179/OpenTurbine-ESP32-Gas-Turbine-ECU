<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Level 1: one system that grows</title><desc id="desc">Functional map — wiring details live in the individual steps. Orange borders mark additions.</desc>
