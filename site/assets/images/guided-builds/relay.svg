<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Relay control and switched power</title><desc id="desc">Nonisolated module: its IN must accept 3.3 V. Module VCC is its rated supply.</desc>
