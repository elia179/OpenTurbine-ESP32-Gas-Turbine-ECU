<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Measure an isolated 12 V battery</title><desc id="desc">16 V maximum for this exercise; no charger, starter or inductive loads connected.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eef4f8;font-size:19px}.small{font-size:16px;fill:#bac9d6}.heading{font-size:26px;font-weight:bold}.net{fill:none;stroke-width:3;stroke-linejoin:round}.heavy{stroke-width:5}</style>
<rect width="1000" height="600" rx="18" fill="#101922"/>
<text x="30" y="42" class="heading" text-anchor="start">Measure an isolated 12 V battery</text>
<text x="30" y="76" class="small" text-anchor="start">16 V maximum for this exercise; no charger, starter or inductive loads connected.</text>
<rect x="30" y="175" width="245" height="265" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="152.5" y="207" class="" text-anchor="middle">12 V battery</text>
<rect x="730" y="175" width="240" height="265" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="850.0" y="207" class="" text-anchor="middle">ESP32 ECU</text>
<text x="50" y="230" class="" text-anchor="start">Positive</text>
<polyline points="275,240 345,240" class="net" stroke="#ff9276"/>
<rect x="345" y="229" width="55" height="22" fill="#101922" stroke="#b6c4d2" stroke-width="2"/>
<text x="345" y="216" class="small" text-anchor="start">Fuse</text>
<polyline points="400,240 465,240 465,265" class="net" stroke="#ff9276"/>
<rect x="456" y="265" width="18" height="42" fill="#101922" stroke="#b6c4d2" stroke-width="2"/>
<text x="483" y="293" class="small" text-anchor="start">68 kΩ top</text>
<polyline points="465,307 465,345 730,345" class="net" stroke="#74dcb7"/>
<text x="750" y="332" class="" text-anchor="start">ADC GPIO</text>
<circle cx="465" cy="345" r="5" fill="#74dcb7"/>
<polyline points="465,345 465,375" class="net" stroke="#74dcb7"/>
<rect x="456" y="375" width="18" height="42" fill="#101922" stroke="#b6c4d2" stroke-width="2"/>
<text x="483" y="403" class="small" text-anchor="start">12 kΩ bottom</text>
<polyline points="465,417 465,480" class="net" stroke="#b6c4d2"/>
<polyline points="150,440 150,480 850,480 850,440" class="net" stroke="#b6c4d2"/>
<circle cx="465" cy="480" r="5" fill="#b6c4d2"/>
<text x="50" y="415" class="" text-anchor="start">Source −</text>
<text x="750" y="415" class="" text-anchor="start">GND</text>
<polyline points="465,345 630,345 630,395" class="net" stroke="#74dcb7"/>
<polyline points="612,395 648,395" class="net" stroke="#74dcb7"/>
<polyline points="612,410 648,410" class="net" stroke="#74dcb7"/>
<polyline points="630,410 630,480" class="net" stroke="#b6c4d2"/>
<circle cx="630" cy="480" r="5" fill="#b6c4d2"/>
<text x="655" y="402" class="small" text-anchor="start">100 nF</text>
<circle cx="465" cy="345" r="5" fill="#74dcb7"/>
<text x="30" y="517" class="small" text-anchor="start">12 V → 1.80 V at ADC. Ratio in Hardware: 6.6667. Live engine buses need protection.</text>
<text x="30" y="558" class="small" text-anchor="start">Signal / command</text>
<polyline points="190,552 242,552" class="net" stroke="#74dcb7"/>
<text x="270" y="558" class="small" text-anchor="start">Supply / load power</text>
<polyline points="447,552 499,552" class="net" stroke="#ff9276"/>
<text x="528" y="558" class="small" text-anchor="start">Ground / return</text>
<polyline points="695,552 747,552" class="net" stroke="#b6c4d2"/>
<text x="30" y="584" class="small" text-anchor="start">Connections are also listed in the guide. Confirm the exact module pinout before wiring.</text></svg>
