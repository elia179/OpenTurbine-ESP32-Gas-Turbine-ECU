<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Hall pulse input</title><desc id="desc">Bench example: DRV5033 at 3.3 V, 10 kΩ external pull-up, 100 nF supply bypass.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eef4f8;font-size:19px}.small{font-size:16px;fill:#bac9d6}.heading{font-size:26px;font-weight:bold}.net{fill:none;stroke-width:3;stroke-linejoin:round}.heavy{stroke-width:5}</style>
<rect width="1000" height="600" rx="18" fill="#101922"/>
<text x="30" y="42" class="heading" text-anchor="start">Hall pulse input</text>
