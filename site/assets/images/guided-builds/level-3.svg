<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">Build 3: gas generator + free power turbine</title><desc id="desc">Gas flow joins the stages. N1 and N2 are mechanically separate shafts.</desc>
<style>text{font-family:Arial,sans-serif;fill:#eef4f8;font-size:19px}.small{font-size:16px;fill:#bac9d6}.heading{font-size:26px;font-weight:bold}.net{fill:none;stroke-width:3;stroke-linejoin:round}.heavy{stroke-width:5}</style>
<rect width="1000" height="600" rx="18" fill="#101922"/>
<text x="30" y="42" class="heading" text-anchor="start">Build 3: gas generator + free power turbine</text>
<text x="30" y="76" class="small" text-anchor="start">Gas flow joins the stages. N1 and N2 are mechanically separate shafts.</text>
<rect x="25" y="145" width="280" height="140" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="165.0" y="177" class="" text-anchor="middle">Gas generator</text>
<text x="45" y="220" class="small" text-anchor="start">Compressor + turbine: N1</text>
<text x="45" y="253" class="small" text-anchor="start">Fuel / spark / starter</text>
<rect x="405" y="145" width="250" height="140" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="530.0" y="177" class="" text-anchor="middle">Free power turbine</text>
<text x="425" y="220" class="small" text-anchor="start">Independent shaft: N2</text>
<text x="425" y="253" class="small" text-anchor="start">Check its own oil supply</text>
<rect x="755" y="145" width="220" height="140" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="865.0" y="177" class="" text-anchor="middle">Driven load</text>
<text x="775" y="220" class="small" text-anchor="start">Coupling / gearing</text>
<text x="775" y="253" class="small" text-anchor="start">Defined load envelope</text>
<polyline points="305,205 405,205" class="net heavy" stroke="#ff9276"/>
<text x="315" y="180" class="small" text-anchor="start">Gas flow</text>
<polyline points="655,205 755,205" class="net heavy" stroke="#b6c4d2"/>
<text x="665" y="180" class="small" text-anchor="start">Shaft</text>
<text x="40" y="325" class="small" text-anchor="start">TOT location: after gas-generator turbine, before added free turbine.</text>
<text x="40" y="357" class="small" text-anchor="start">Moving the probe changes what its readings and limits mean.</text>
<rect x="180" y="400" width="640" height="95" rx="10" fill="#1c2b38" stroke="#566a7c" stroke-width="2"/>
<text x="500.0" y="432" class="" text-anchor="middle">OpenTurbine: both speeds + temperature + oil</text>
<polyline points="165,285 165,445 180,445" class="net" stroke="#74dcb7"/>
<polyline points="530,285 530,400" class="net" stroke="#74dcb7"/>
<text x="30" y="525" class="small" text-anchor="start">Fuel governor uses N2; independent N1 / N2 / temperature protection remains active.</text>
<text x="30" y="558" class="small" text-anchor="start">Signal / command</text>
<polyline points="190,552 242,552" class="net" stroke="#74dcb7"/>
<text x="270" y="558" class="small" text-anchor="start">Supply / load power</text>
<polyline points="447,552 499,552" class="net" stroke="#ff9276"/>
<text x="528" y="558" class="small" text-anchor="start">Ground / return</text>
<polyline points="695,552 747,552" class="net" stroke="#b6c4d2"/>
<text x="30" y="584" class="small" text-anchor="start">Connections are also listed in the guide. Confirm the exact module pinout before wiring.</text></svg>
