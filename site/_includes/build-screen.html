<figure class="build-figure build-screen">
  {% assign dimensions = site.data.screenshot_dimensions[include.file] %}
  <div class="build-screen-viewport" role="region" aria-label="{{ include.step | escape }} screenshot" tabindex="0"><img src="{{ '/assets/images/guided-builds/' | append: include.file | append: '.png' | relative_url }}" {% if dimensions %}width="{{ dimensions.width }}" height="{{ dimensions.height }}"{% endif %} loading="lazy" alt="{{ include.alt | escape }}"></div>
  <figcaption><strong>{{ include.step | escape }}</strong> {{ include.caption }}</figcaption>
</figure>
